name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Keep this on the same image as the release build in build-macos.yml.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        timeout-minutes: 20
        run: timeout 20m swift test

      - name: Bundle
        run: scripts/bundle.sh

      - name: Headless selftests
        timeout-minutes: 10
        run: |
          # --selftest-keys and --selftest need an interactive GUI session, so they are
          # not run here. --selftest-keys calls NSApp.activate and shows the tray.
          # --selftest requires a display (NSScreen) and installs panels, the hotkey,
          # and the drag monitor. A runner has no such session; either check exits
          # early or hangs waiting on window-server state.
          timeout 3m build/Logn.app/Contents/MacOS/OLogN --selftest-replace
          timeout 3m build/Logn.app/Contents/MacOS/OLogN --selftest-history
