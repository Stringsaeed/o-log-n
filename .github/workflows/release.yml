# Cutting a release:
#   1. Merge work into main with Conventional Commit messages (feat:, fix:, perf: …).
#   2. release-please keeps a "chore: release x.y.z" PR open with the version bump + CHANGELOG.
#   3. Merge that PR → it tags vX.Y.Z and opens a *draft* GitHub release; this workflow then
#      builds, signs, notarizes, uploads the DMG, publishes the release and bumps the Homebrew cask.
# Re-run a build for an existing tag with "Run workflow" (workflow_dispatch).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.2.0)
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on the release pull request (see below)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      # Root package "." is reported without a path prefix (release_created, tag_name).
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # The Actions token is the GitHub Actions app. Release commits are then signed by
          # GitHub (author github-actions[bot], committer web-flow). A user PAT authenticates
          # as that user and the same Git Data API call is stored unsigned.
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `macos` is a required check on main, but a pull request opened with the
      # Actions token does not trigger workflows, so the release pull request
      # would never get one. Start CI on its branch by hand. It only changes
      # release files, so CI skips the macOS job and reports straight away.
      - name: Run CI on the release pull request
        if: steps.rp.outputs.release_created != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' \
            --json headRefName --jq '.[].headRefName' |
          while read -r branch; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done

  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/build-macos.yml
    with:
      tag: ${{ needs.release-please.outputs.tag || inputs.tag }}
    secrets: inherit
